name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build

      # Pull requests get a preview deployment named after their branch.
      # Skipped when the token isn't available (for example on forks).
      - name: Deploy preview
        if: github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: bunx wrangler preview --name "${{ github.head_ref }}"

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bunx wrangler deploy
